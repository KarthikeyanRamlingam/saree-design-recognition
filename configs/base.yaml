seed: 42
data:
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  image_size: 320
  workers: 2
model:
  backbone: convnext_tiny
  embedding_dim: 256
  pretrained: true
train:
  epochs: 25
  batch_size: 16
  backbone_lr: 0.00003
  head_lr: 0.0003
  weight_decay: 0.0001
  arc_scale: 30.0
  arc_margin: 0.30
  supcon_weight: 0.5
  invariance_weight: 0.25
  temperature: 0.07
  patience: 5
  amp: true
output_dir: outputs/convnext_tiny

